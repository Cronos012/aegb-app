# Met la base Supabase en ligne à jour avec les fichiers de supabase/migrations.
# Se lance tout seul quand une migration change sur main ou sur une branche de lot.
# Il lui faut deux secrets GitHub (Settings → Secrets and variables → Actions) :
#   SUPABASE_ACCESS_TOKEN : un jeton d'accès Supabase (Account → Access Tokens)
#   SUPABASE_DB_PASSWORD  : le mot de passe de la base du projet
# Sans eux, il ne fait rien et le dit.
name: Base Supabase

on:
  push:
    branches: [main, 'lot-*']
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - '.github/workflows/base-supabase.yml'
  workflow_dispatch:

concurrency:
  group: base-supabase
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: lahllstfpmjfcavptlmt
    steps:
      - name: Vérifier les secrets
        id: secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::Secrets SUPABASE_ACCESS_TOKEN ou SUPABASE_DB_PASSWORD absents : base non mise à jour."
            echo "pret=non" >> "$GITHUB_OUTPUT"
          else
            echo "pret=oui" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.pret == 'oui'

      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.pret == 'oui'
        with:
          version: latest

      - name: Relier le projet
        if: steps.secrets.outputs.pret == 'oui'
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Migrations à appliquer
        if: steps.secrets.outputs.pret == 'oui'
        run: supabase db push --dry-run

      - name: Appliquer les migrations
        if: steps.secrets.outputs.pret == 'oui'
        run: supabase db push

      - name: Vérifier que la base et les fichiers sont alignés
        if: steps.secrets.outputs.pret == 'oui'
        run: supabase migration list
