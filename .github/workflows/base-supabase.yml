# Met la base Supabase en ligne à jour avec les fichiers de supabase/migrations,
# et publie les fonctions serveur de supabase/functions.
# Se lance tout seul quand l'un d'eux change sur main ou sur une branche de lot.
# Il lui faut deux secrets GitHub (Settings → Secrets and variables → Actions) :
#   SUPABASE_ACCESS_TOKEN : un jeton d'accès Supabase (Account → Access Tokens)
#   SUPABASE_DB_PASSWORD  : le mot de passe de la base du projet
# Sans eux, il ne fait rien et le dit.
# Il règle aussi les limites de connexion de Supabase (supabase/limites-connexion.json) :
# le jour de l'AG, toute une salle se connecte depuis le même wifi, donc la même
# adresse internet, et la limite d'origine (30 d'un coup, puis 30 par minute)
# bloquerait les suivants.
# Pour le paiement par carte, il pose aussi les identifiants HelloAsso s'ils
# sont dans les secrets : HELLOASSO_CLIENT_ID, HELLOASSO_CLIENT_SECRET,
# HELLOASSO_ORG et, pour les vrais paiements, HELLOASSO_ENV = production.
name: Base Supabase

on:
  push:
    branches: [main, 'lot-*']
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - 'supabase/limites-connexion.json'
      - '.github/workflows/base-supabase.yml'
  workflow_dispatch:

concurrency:
  group: base-supabase
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrations:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: lahllstfpmjfcavptlmt
    steps:
      - name: Vérifier les secrets
        id: secrets
        env:
          HELLOASSO_CLIENT_ID: ${{ secrets.HELLOASSO_CLIENT_ID }}
          HELLOASSO_CLIENT_SECRET: ${{ secrets.HELLOASSO_CLIENT_SECRET }}
          HELLOASSO_ORG: ${{ secrets.HELLOASSO_ORG }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::Secrets SUPABASE_ACCESS_TOKEN ou SUPABASE_DB_PASSWORD absents : base non mise à jour."
            echo "pret=non" >> "$GITHUB_OUTPUT"
          else
            echo "pret=oui" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$HELLOASSO_CLIENT_ID" ] && [ -n "$HELLOASSO_CLIENT_SECRET" ] && [ -n "$HELLOASSO_ORG" ]; then
            echo "helloasso=oui" >> "$GITHUB_OUTPUT"
          else
            echo "Identifiants HelloAsso absents : le paiement par carte reste débranché."
            echo "helloasso=non" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.pret == 'oui'

      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.pret == 'oui'
        with:
          version: latest

      - name: Relier le projet
        if: steps.secrets.outputs.pret == 'oui'
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Migrations à appliquer
        if: steps.secrets.outputs.pret == 'oui'
        run: supabase db push --linked --dry-run

      - name: Appliquer les migrations
        if: steps.secrets.outputs.pret == 'oui'
        run: supabase db push --linked

      - name: Vérifier que la base et les fichiers sont alignés
        if: steps.secrets.outputs.pret == 'oui'
        run: supabase migration list --linked

      - name: Limites de connexion
        if: steps.secrets.outputs.pret == 'oui'
        run: |
          api="https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth"
          # Seules les limites s'affichent : le reste des réglages contient des secrets.
          limites() {
            curl -fsS "$api" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              | jq -S 'with_entries(select(.key | startswith("rate_limit_")))'
          }
          echo "Avant :"; limites
          reponse="$(mktemp)"
          if ! curl -sS --fail-with-body -o "$reponse" -X PATCH "$api" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            --data @supabase/limites-connexion.json; then
            # En cas de refus, la réponse ne contient que le motif.
            cat "$reponse"; rm -f "$reponse"; exit 1
          fi
          rm -f "$reponse"
          echo "Après :"; limites

      - name: Brancher HelloAsso
        if: steps.secrets.outputs.pret == 'oui' && steps.secrets.outputs.helloasso == 'oui'
        env:
          HELLOASSO_CLIENT_ID: ${{ secrets.HELLOASSO_CLIENT_ID }}
          HELLOASSO_CLIENT_SECRET: ${{ secrets.HELLOASSO_CLIENT_SECRET }}
          HELLOASSO_ORG: ${{ secrets.HELLOASSO_ORG }}
          HELLOASSO_ENV: ${{ secrets.HELLOASSO_ENV }}
        run: |
          fichier="$(mktemp)"
          {
            echo "HELLOASSO_CLIENT_ID=$HELLOASSO_CLIENT_ID"
            echo "HELLOASSO_CLIENT_SECRET=$HELLOASSO_CLIENT_SECRET"
            echo "HELLOASSO_ORG=$HELLOASSO_ORG"
            echo "HELLOASSO_ENV=${HELLOASSO_ENV:-sandbox}"
          } > "$fichier"
          supabase secrets set --project-ref "$PROJECT_REF" --env-file "$fichier"
          rm -f "$fichier"

      - name: Publier les fonctions serveur
        if: steps.secrets.outputs.pret == 'oui'
        run: supabase functions deploy --project-ref "$PROJECT_REF"
