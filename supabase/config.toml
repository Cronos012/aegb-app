# Réglages lus par l'outil Supabase, que GitHub utilise pour mettre la base à jour.
project_id = "aegb-app"

[db]
major_version = 17

# Le paiement par carte : HelloAsso appelle cette fonction sans être connecté,
# et l'appli l'appelle avec la session du membre. La fonction vérifie
# elle-même qui l'appelle.
[functions.helloasso]
verify_jwt = false

# Les notifications : la base appelle cette fonction quand des notifications
# attendent, sans être connectée. La fonction ne prend que la file d'envoi.
[functions.push]
verify_jwt = false

# Chaque nuit, la base appelle cette fonction pour effacer les comptes fermés
# depuis 30 jours. Elle n'efface que ceux-là.
[functions.comptes]
verify_jwt = false
